<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Birlik Lezzetleri | Ana Kontrol Merkezi</title><meta name="robots" content="noindex,nofollow"><style>
:root{color-scheme:dark;--bg:#101d17;--panel:#1d3428;--line:#385344;--gold:#e6c68c;--text:#edf4ef;--muted:#b7c9bd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}header{position:sticky;top:0;z-index:2;background:#15271e;border-bottom:1px solid var(--line);padding:13px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{margin:0;color:var(--gold);font-size:20px;letter-spacing:1px}header p{margin:3px 0 0;font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}button,a{font:inherit}button,.link{border:1px solid #53715f;border-radius:8px;background:#294739;color:var(--text);padding:7px 10px;text-decoration:none;cursor:pointer}button:hover,.link:hover,button[aria-pressed=true]{background:var(--gold);color:#14251c;border-color:var(--gold)}button:focus-visible,a:focus-visible{outline:3px solid #e6c68c;outline-offset:2px}main{padding:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;height:max(410px,calc((100dvh - 108px)/2))}.tile[hidden]{display:none}.bar{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px;flex-wrap:wrap}.bar h2{font-size:14px;letter-spacing:.4px;margin:0;color:var(--gold)}.bar div{display:flex;gap:5px;flex-wrap:wrap}.bar button,.bar a{font-size:12px;padding:5px 7px}iframe{display:block;width:100%;border:0;background:#faf7f1;flex:1;min-height:0}main.operations{grid-template-columns:repeat(2,minmax(0,1fr))}main.focused{grid-template-columns:1fr}main.focused .tile{height:max(540px,calc(100dvh - 94px))}footer{color:var(--muted);padding:8px 16px 18px;font-size:12px}#back{display:none}main.focused~footer{display:none}@media(max-width:1100px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){header{position:static;padding:12px}main,main.operations{grid-template-columns:1fr}.tile{height:570px}main.focused .tile{height:75dvh}}
</style></head><body><header><div><h1>BİRLİK LEZZETLERİ</h1><p>ANA KONTROL MERKEZİ · Tüm paneller tek ekranda</p></div><div class="toolbar"><button id="all" aria-pressed="true">6 ekran</button><button id="operations" aria-pressed="false">4 personel ekranı</button><button id="back">Çoklu ekrana dön</button><button id="fullscreen">Tam ekran</button></div></header><main id="panels" aria-label="Kontrol panelleri"></main><footer>Her panel bağımsız çalışır. Personel panellerinin otomatik güncellemesi devam eder. Yönetim ve personel ekranları mevcut kurulumdaki erişim kurallarını kullanır.</footer><script>
'use strict';const defs=[['garson','Garson','/garson'],['mutfak','Mutfak','/mutfak'],['gorevli','Görevli','/gorevli'],['kasa','Kasa','/kasa'],['menu','Müşteri menüsü','/'],['admin','Yönetim','/admin']];const main=document.getElementById('panels');let mode='all',focus=null;for(const [id,title,path] of defs){const tile=document.createElement('section');tile.className='tile';tile.dataset.id=id;const bar=document.createElement('div');bar.className='bar';const h=document.createElement('h2');h.textContent=title.toLocaleUpperCase('tr-TR');const controls=document.createElement('div');const expand=document.createElement('button');expand.type='button';expand.textContent='Büyüt';expand.dataset.expand=id;expand.setAttribute('aria-label',title+' ekranını büyüt');const open=document.createElement('a');open.className='link';open.href=path;open.target='_blank';open.rel='noopener';open.textContent='Ayrı aç ↗';const frame=document.createElement('iframe');frame.title=title;frame.src=path;controls.append(expand,open);bar.append(h,controls);tile.append(bar,frame);main.append(tile);expand.addEventListener('click',()=>{focus=focus===id?null:id;render();if(focus)window.scrollTo(0,0);});}
function render(){main.className=focus?'focused':mode==='operations'?'operations':'';for(const tile of main.children){const id=tile.dataset.id;tile.hidden=focus?id!==focus:mode==='operations'&&['menu','admin'].includes(id);const button=tile.querySelector('button');button.textContent=focus===id?'Küçült':'Büyüt';button.setAttribute('aria-label',tile.querySelector('iframe').title+(focus===id?' ekranını küçült':' ekranını büyüt'));}document.getElementById('all').setAttribute('aria-pressed',String(!focus&&mode==='all'));document.getElementById('operations').setAttribute('aria-pressed',String(!focus&&mode==='operations'));document.getElementById('back').style.display=focus?'inline-block':'none';}
document.getElementById('all').onclick=()=>{mode='all';focus=null;render();};document.getElementById('operations').onclick=()=>{mode='operations';focus=null;render();};document.getElementById('back').onclick=()=>{focus=null;render();};const full=document.getElementById('fullscreen');if(!document.documentElement.requestFullscreen)full.hidden=true;full.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{full.textContent='Tam ekran kullanılamıyor';}};document.addEventListener('fullscreenchange',()=>{full.textContent=document.fullscreenElement?'Tam ekrandan çık':'Tam ekran';});render();
</script></body></html>
